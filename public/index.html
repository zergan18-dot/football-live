<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Live — расписание матчей</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif}
header{background:#172438;padding:22px 16px;text-align:center;border-bottom:2px solid #32d583}
header h1{margin:0;color:#32d583;font-size:28px}
header p{color:#b8c5d6;margin:8px 0 0}
main{max-width:900px;margin:25px auto;padding:0 14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,button{padding:12px;border:0;border-radius:8px;font-size:15px}
input{flex:1;min-width:150px;background:#243248;color:white}
button{background:#32d583;color:#102019;font-weight:bold;cursor:pointer}
#status{color:#b8c5d6;margin:16px 0}
.match{background:#1b293d;padding:16px;border-radius:12px;margin:12px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.team{text-align:center;font-weight:bold}
.team img{width:36px;height:36px;object-fit:contain;display:block;margin:0 auto 8px}
.score{text-align:center;font-size:20px;font-weight:bold}
.time{font-size:12px;color:#b8c5d6;margin-top:5px}
.league{font-size:12px;color:#32d583;margin-bottom:8px}
.empty{text-align:center;padding:25px;color:#b8c5d6}
</style>
</head>
<body>
<header>
<h1>⚽ FOOTBALL LIVE</h1>
<p>Расписание футбольных матчей</p>
</header>
<main>
<div class="controls">
<input id="date" type="date">
<input id="search" placeholder="Поиск команды или лиги">
<button id="load">Найти матчи</button>
</div>
<div id="status">Загружаем расписание...</div>
<div id="matches"></div>
</main>
<script>
const dateInput=document.getElementById('date');
const searchInput=document.getElementById('search');
const statusBox=document.getElementById('status');
const matchesBox=document.getElementById('matches');

function localDate(){
 const d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
dateInput.value=localDate();

function escapeHtml(s){
 return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadMatches(){
 matchesBox.innerHTML='';
 statusBox.textContent='Загружаем матчи...';
 try{
  const r=await fetch('/api/fixtures?date='+encodeURIComponent(dateInput.value));
  const data=await r.json();
  if(!r.ok) throw new Error(data.message||data.error||'Ошибка сервера');
  const list=data.results||[];
  statusBox.textContent='Найдено матчей: '+list.length;
  const q=searchInput.value.trim().toLowerCase();
  const filtered=list.filter(m=>{
   const text=[m.league?.name,m.teams?.home?.name,m.teams?.away?.name].join(' ').toLowerCase();
   return text.includes(q);
  });
  if(!filtered.length){
   matchesBox.innerHTML='<div class="empty">На выбранную дату матчей не найдено.</div>';
   return;
  }
  matchesBox.innerHTML=filtered.map(m=>{
   const home=m.teams?.home||{},away=m.teams?.away||{},league=m.league||{},g=m.goals||{};
   const time=m.fixture?.date?new Date(m.fixture.date).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Amsterdam'}):'';
   const live=['1H','HT','2H','ET','P','LIVE'].includes(m.fixture?.status?.short);
   const score=live||m.fixture?.status?.short==='FT'?(g.home??0)+' : '+(g.away??0):'VS';
   return `<article class="match"><div class="team"><img src="${escapeHtml(home.logo||'')}" alt=""><div>${escapeHtml(home.name)}</div></div><div class="score">${score}<div class="time">${escapeHtml(time)}<br>${escapeHtml(m.fixture?.status?.long||'')}</div></div><div class="team"><img src="${escapeHtml(away.logo||'')}" alt=""><div>${escapeHtml(away.name)}</div></div><div class="league" style="grid-column:1/-1">${escapeHtml(league.name||'Футбол')} · ${escapeHtml(league.country||'')}</div></article>`;
  }).join('');
 }catch(e){
  statusBox.textContent='Не удалось загрузить матчи: '+e.message;
  matchesBox.innerHTML='<div class="empty">Проверь настройки API и попробуй ещё раз.</div>';
 }
}
document.getElementById('load').addEventListener('click',loadMatches);
searchInput.addEventListener('input',()=>{
 if(statusBox.textContent.startsWith('Найдено')) loadMatches();
});
loadMatches();
</script>
</body>
</html>
